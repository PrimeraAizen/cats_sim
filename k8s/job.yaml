# One simulator run on the cluster. The Jenkins "Deploy to Minikube" stage creates a
# new Job from this template for every build of main and waits for it to complete.
# The __PLACEHOLDERS__ are filled in by the Jenkinsfile.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: cats-sim
  labels:
    app.kubernetes.io/name: cats-sim
    app.kubernetes.io/component: smoke-run
    app.kubernetes.io/version: "__VERSION__"
    app.kubernetes.io/managed-by: jenkins
  annotations:
    cats-sim/git-commit: "__GIT_COMMIT__"
    cats-sim/jenkins-build: "__BUILD_URL__"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400  # finished Jobs are kept for a day, then removed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cats-sim
        app.kubernetes.io/component: smoke-run
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cats-sim
          image: __IMAGE__
          args: ["run", "configs/smoke.toml", "--output-dir", "/results"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: results
          emptyDir: {}
        - name: tmp
          emptyDir: {}
