# Keep GitHub Actions, the locked Python dependencies and the Docker base images up to date.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/", "/jenkins"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
      runtime:
        dependency-type: production
