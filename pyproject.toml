[build-system]
requires = ["hatchling>=1.27"]  # 1.27+: PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "cats-sim"
version = "1.0.0"
description = "Discrete-event simulator for evaluating tip selection algorithms (CATS, URTS, MCMC, S-URTS, G-IOTA) on DAG-based distributed ledgers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "<Your Name>" }]
keywords = ["iota", "tangle", "dag", "distributed-ledger", "tip-selection", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
cats-sim = "cats_sim.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cats_sim"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/legacy", "/scripts", "/results"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "N",        # pep8-naming
    "NPY",      # NumPy-specific rules (e.g. legacy np.random calls)
    "PT",       # flake8-pytest-style
    "RUF",      # ruff-specific rules
]
# Greek letters (α, σ, λ, μ, ρ, κ, γ) are the paper's notation and are used on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pep8-naming]
# Single-letter capitals mirror the paper's notation (D = distribution, T = threshold, P = matrix).
ignore-names = ["D", "T", "P", "S", "L_star", "mu_D", "sigma_D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cats_sim"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
